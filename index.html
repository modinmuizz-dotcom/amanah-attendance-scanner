<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>AMANAH Attendance</title>

  <link rel="stylesheet" href="style.css">

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      AC
    </div>

    <div class="header-text">
      <h1>AMANAH CONSTRUCTION</h1>
      <p>Management System • Attendance</p>
    </div>

  </header>


  <!-- STATUS -->
  <section class="card">

    <div class="title-row">

      <div>
        <h2 id="pageTitle">Scan Attendance QR</h2>

        <p id="pageSubtitle">
          Scan the AMANAH company QR code to begin.
        </p>
      </div>

      <span id="connectionBadge" class="badge">
        HTTPS
      </span>

    </div>


    <!-- CAMERA -->

    <div id="reader"></div>


    <!-- STATUS MESSAGE -->

    <div id="status" class="status">
      Starting camera...
    </div>


    <!-- EMPLOYEE INFORMATION -->

    <div id="employeePanel" class="employee-panel hidden">

      <div class="employee-header">
        <span>EMPLOYEE</span>
      </div>

      <div class="employee-name" id="employeeName">
        —
      </div>

      <div class="employee-id" id="employeeId">
        —
      </div>

      <div class="employee-position" id="employeePosition">
        —
      </div>

    </div>


    <!-- ACTION BUTTONS -->

    <div id="actions" class="actions hidden">

      <button
        id="inButton"
        class="action-button in-button"
        onclick="recordAttendance('IN')"
      >
        <span>✓</span>
        TIME IN
      </button>


      <button
        id="outButton"
        class="action-button out-button"
        onclick="recordAttendance('OUT')"
      >
        <span>↗</span>
        TIME OUT
      </button>

    </div>


    <!-- RESET -->

    <button
      id="resetButton"
      class="reset-button hidden"
      onclick="resetScanner()"
    >
      SCAN ANOTHER EMPLOYEE
    </button>

  </section>


  <!-- FOOTER -->

  <footer>
    AMANAH CONSTRUCTION MANAGEMENT SYSTEM
  </footer>

</div>


<script src="app.js"></script>

</body>
</html>
