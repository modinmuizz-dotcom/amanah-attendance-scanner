<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b5ed7">

  <title>AMANAH CONSTRUCTION - Attendance</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>

<body>

<main class="app">

  <section class="card header-card">
    <div class="brand-mark">AC</div>

    <div>
      <h1>AMANAH CONSTRUCTION</h1>
      <p>Management System • Attendance</p>
    </div>
  </section>


  <!-- QR SCANNER -->

  <section id="scannerSection" class="card">

    <div class="section-title">

      <div>
        <h2>Scan Attendance QR</h2>
        <p>Scan the single company QR code to begin.</p>
      </div>

      <span class="badge">HTTPS</span>

    </div>

    <div id="reader"></div>

    <div id="scanStatus" class="status">
      Starting camera...
    </div>

    <button
      id="startCameraBtn"
      class="secondary hidden">
      Open Camera
    </button>

  </section>


  <!-- ATTENDANCE FORM -->

  <section id="formSection" class="card hidden">

    <div class="success-banner">

      <strong>QR VERIFIED</strong>

      <span>
        Now complete your attendance.
      </span>

    </div>


    <!-- EMPLOYEE -->

    <label>Who are you?</label>

    <select id="employeeSelect">
      <option value="">
        Select employee
      </option>
    </select>


    <!-- EQUIPMENT -->

    <label>Equipment</label>

    <select id="equipmentSelect">
      <option value="">
        Select equipment
      </option>
    </select>


    <!-- PROJECT -->

    <label>Project</label>

    <select id="projectSelect">
      <option value="">
        Select project
      </option>
    </select>


    <!-- ACTION -->

    <div class="action-grid">

      <button
        id="inBtn"
        class="primary">
        TIME IN
      </button>

      <button
        id="outBtn"
        class="danger">
        TIME OUT
      </button>

    </div>


    <!-- FUEL -->

    <div
      id="fuelSection"
      class="fuel-box hidden">

      <div class="fuel-heading">

        <h3>Fuel Used</h3>

        <span>Optional</span>

      </div>


      <label>
        Did you fuel this equipment?
      </label>


      <div class="choice-grid">

        <button
          type="button"
          class="choice"
          data-fuel="no">

          NO

        </button>


        <button
          type="button"
          class="choice"
          data-fuel="yes">

          YES

        </button>

      </div>


      <div id="fuelFields" class="hidden">

        <label>
          Fuel amount
        </label>

        <input
          id="fuelAmount"
          type="number"
          min="0"
          step="0.01"
          placeholder="Example: 25">


        <label>
          Unit
        </label>

        <select id="fuelUnit">

          <option value="Liter">
            Liter
          </option>

          <option value="Gallon">
            Gallon
          </option>

        </select>


        <label>
          Fuel price
        </label>

        <div class="price-input">

          <span>₱</span>

          <input
            id="fuelPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="Example: 60.50">

        </div>

      </div>

    </div>


    <div
      id="message"
      class="status">
    </div>


    <button
      id="resetBtn"
      class="secondary">

      Scan Another QR

    </button>

  </section>


  <section class="footer-note">

    AMANAH CONSTRUCTION MANAGEMENT SYSTEM

  </section>

</main>


<script src="app.js"></script>

</body>
</html>
