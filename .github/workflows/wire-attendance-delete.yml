name: Wire attendance delete handler

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-attendance-delete.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add attendance delete handler script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('attendance.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="attendance-delete.js?v=1"></script>'
          if marker not in s:
              target = '<script src="amanah-ui.js?v=7"></script>'
              if target not in s:
                  raise SystemExit('attendance.html script anchor not found')
              s = s.replace(target, marker + '\n\n' + target, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit attendance wiring and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance.html
          git rm .github/workflows/wire-attendance-delete.yml
          git commit -m "fix: wire attendance delete handler" || exit 0
          git push
